<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NodusPro Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0F1A;--surface:#111827;--surface2:#1C2333;--surface3:#243048;
  --border:#1E2D45;--border2:#2A3F60;
  --text:#F0F4FC;--text2:#C8D6EE;--text3:#8AAAD0;
  --blue:#2563EB;--gold:#F4C300;--gold2:#D4A800;
  --green:#059669;--green-pale:rgba(5,150,105,.15);--green-bd:rgba(5,150,105,.35);
  --red:#DC2626;--red-pale:rgba(220,38,38,.12);--red-bd:rgba(220,38,38,.3);
  --amber:#D97706;--amber-pale:rgba(217,119,6,.12);--amber-bd:rgba(217,119,6,.3);
  --purple:#7C3AED;--purple-pale:rgba(124,58,237,.12);--purple-bd:rgba(124,58,237,.3);
  --cyan:#0891B2;--cyan-pale:rgba(8,145,178,.12);
}
html{-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-box{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:12px;padding:32px;width:100%;max-width:360px}
.login-logo{font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px}
.login-logo span{color:var(--gold)}
.login-sub{font-size:11px;color:var(--text3);margin-bottom:24px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.login-label{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.login-input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:7px;padding:10px 14px;font-size:14px;color:var(--text);outline:none;font-family:'Inter',sans-serif;transition:border .15s}
.login-input:focus{border-color:var(--gold)}
.login-btn{width:100%;margin-top:14px;padding:11px;background:var(--gold);color:#0A0F1A;border:none;border-radius:7px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif}
.login-btn:hover{background:var(--gold2)}
.login-err{color:#F87171;font-size:12px;margin-top:8px}

.app{display:none;height:100vh;overflow:hidden;flex-direction:column}
.app.on{display:flex}
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-logo{font-size:15px;font-weight:800;color:var(--text)}.tb-logo span{color:var(--gold)}
.tb-tag{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px}
.tb-right{display:flex;align-items:center;gap:8px}
.tbtn{font-size:12px;font-weight:600;padding:6px 13px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:5px}
.tbtn:hover{color:var(--text);border-color:var(--blue)}
.tbtn.green{background:var(--green-pale);border-color:var(--green-bd);color:#6EE7B7}
.tbtn.green:hover{background:var(--green);color:white}

.tabs{display:flex;gap:2px;padding:10px 20px 0;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.tab{font-size:12px;font-weight:600;padding:7px 14px;border-radius:6px 6px 0 0;color:var(--text3);cursor:pointer;border:1px solid transparent;border-bottom:none;position:relative;top:1px}
.tab:hover{color:var(--text2)}
.tab.on{background:var(--bg);border-color:var(--border);color:var(--text)}
.badge{display:inline-block;background:var(--amber-pale);color:#FCD34D;border:1px solid var(--amber-bd);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:4px}

.main{flex:1;overflow-y:auto;padding:20px}

.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.mc-lbl{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.mc-val{font-size:28px;font-weight:800;color:#FFFFFF;line-height:1;margin-bottom:4px}
.mc-sub{font-size:11px;color:var(--text3)}
.mc-bar{height:3px;background:var(--border);border-radius:2px;margin-top:10px}
.mc-fill{height:100%;border-radius:2px}

.cr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px}
.cc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.cc-ttl{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
.bi{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bl{font-size:12px;color:var(--text2);width:90px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{flex:1;height:6px;background:var(--border);border-radius:3px}
.bf{height:100%;border-radius:3px}
.bv{font-size:11px;color:var(--text3);width:28px;text-align:right;font-family:monospace}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px}
.sb{flex:1;background:var(--blue);border-radius:2px 2px 0 0;opacity:.7;min-height:2px}
.sl{display:flex;justify-content:space-between;margin-top:4px}
.slbl{font-size:9px;color:var(--text3)}

.th{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.th-ttl{font-size:13px;font-weight:600;color:var(--text)}
.th-ctrl{display:flex;align-items:center;gap:8px}
.srch{background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:6px 12px;font-size:12px;color:var(--text);outline:none;font-family:'Inter',sans-serif;width:200px}
.srch::placeholder{color:var(--text3)}
.srch:focus{border-color:var(--blue)}
.fsel{background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--text2);outline:none;font-family:'Inter',sans-serif}

.twrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 12px;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.nc{font-weight:700;color:#FFFFFF;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ec{font-family:monospace;font-size:11px;color:#B0C4DE;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.pill.approved{background:var(--green-pale);color:#34D399;border:1px solid var(--green-bd)}
.pill.pending{background:var(--amber-pale);color:#FCD34D;border:1px solid var(--amber-bd)}
.pill.rejected{background:var(--red-pale);color:#F87171;border:1px solid var(--red-bd)}
.pill.flagged{background:var(--purple-pale);color:#A78BFA;border:1px solid var(--purple-bd)}
.pill.verif{background:var(--cyan-pale);color:#67E8F9;border:1px solid rgba(8,145,178,.3)}
.cv-b{display:inline-flex;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--purple-pale);color:#A78BFA;border:1px solid var(--purple-bd)}
.ac{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.a{font-size:11px;font-weight:600;padding:4px 8px;border-radius:5px;border:1px solid;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
.a.v{background:var(--surface2);border-color:var(--border2);color:var(--text2)}
.a.v:hover{border-color:var(--blue);color:#93C5FD}
.a.ap{background:var(--green-pale);border-color:var(--green-bd);color:#6EE7B7}
.a.ap:hover{background:var(--green);color:white}
.a.rj{background:var(--red-pale);border-color:var(--red-bd);color:#F87171}
.a.rj:hover{background:var(--red);color:white}
.a.ed{background:var(--purple-pale);border-color:var(--purple-bd);color:#A78BFA}
.a.ed:hover{background:var(--purple);color:white}
.a.dl{background:var(--red-pale);border-color:var(--red-bd);color:#F87171}
.a.dl:hover{background:var(--red);color:white}
.a:disabled{opacity:.4;cursor:not-allowed}

.pg{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--text3)}
.pgb{display:flex;gap:4px}
.pb{padding:4px 10px;border-radius:5px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;font-size:11px;font-family:'Inter',sans-serif}
.pb:hover{border-color:var(--blue);color:var(--text)}
.pb.on{background:var(--blue);border-color:var(--blue);color:white}
.pb:disabled{opacity:.4;cursor:not-allowed}

.dp{position:fixed;top:0;right:0;bottom:0;width:480px;background:var(--surface);border-left:1px solid var(--border);z-index:100;display:none;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.4)}
.dp.on{display:flex}
.dp-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.dp-name{font-size:16px;font-weight:700;color:var(--text)}
.dp-email{font-size:11px;color:var(--text3);font-family:monospace;margin-top:2px}
.dp-x{width:28px;height:28px;border-radius:6px;background:var(--surface2);border:1px solid var(--border2);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:16px;line-height:1}
.dp-body{flex:1;overflow-y:auto;padding:20px}
.ds{margin-bottom:20px}
.ds-ttl{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px}
.fld.full{grid-column:1/-1}
.fl{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.fv{font-size:13px;color:var(--text);font-weight:500;word-break:break-all}
.fv.m{font-family:monospace;font-size:12px}
.fv.e{color:var(--text3);font-style:italic;font-weight:400}
.cv-sec{background:var(--purple-pale);border:1px solid var(--purple-bd);border-radius:8px;padding:14px}
.cv-dl{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--purple);color:white;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.cv-dl:hover{opacity:.85}
.dp-act{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.da{flex:1;padding:9px;border-radius:7px;border:1px solid;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;min-width:80px;text-align:center}
.da.ap{background:var(--green-pale);border-color:var(--green-bd);color:#6EE7B7}
.da.ap:hover{background:var(--green);color:white}
.da.rj{background:var(--red-pale);border-color:var(--red-bd);color:#F87171}
.da.rj:hover{background:var(--red);color:white}
.da.ed{background:var(--purple-pale);border-color:var(--purple-bd);color:#A78BFA}
.da.ed:hover{background:var(--purple);color:white}
.da.dl{background:var(--red-pale);border-color:var(--red-bd);color:#F87171}
.da.dl:hover{background:var(--red);color:white}

.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.mo.on{display:flex}
.mb{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:12px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.mh{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mttl{font-size:14px;font-weight:700;color:var(--text)}
.mx{width:26px;height:26px;border-radius:5px;background:var(--surface2);border:1px solid var(--border2);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:16px;line-height:1}
.mbody{padding:20px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg2{display:flex;flex-direction:column;gap:5px}
.fg2.full{grid-column:1/-1}
.lbl{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3)}
input.fi,select.fi,textarea.fi{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:8px 11px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;outline:none;width:100%}
input.fi:focus,select.fi:focus,textarea.fi:focus{border-color:var(--gold)}
textarea.fi{resize:vertical;min-height:70px}
.mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px}
.msave{flex:1;padding:10px;background:var(--gold);color:#0A0F1A;border:none;border-radius:7px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif}
.msave:hover{background:var(--gold2)}
.mcancel{padding:10px 18px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;font-size:13px;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif}

.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:320px}
.toast.on{opacity:1}
.toast.ok{background:#065F46;color:#6EE7B7;border:1px solid #047857}
.toast.err{background:#7F1D1D;color:#FCA5A5;border:1px solid #991B1B}
.toast.inf{background:#1E3A5F;color:#93C5FD;border:1px solid #1D4ED8}
</style>
</head>
<body>

<div id="loginWrap" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px">
  <div class="login-box">
    <div class="login-logo"><span>Nodus</span>Pro</div>
    <div class="login-sub">Panel de Administracion</div>
    <label class="login-label">Contrasena</label>
    <input class="login-input" type="password" id="lpass" placeholder="Contrasena de acceso">
    <button class="login-btn" id="loginBtn">Entrar</button>
    <div id="loginErr" style="color:#F87171;font-size:12px;margin-top:8px;display:none">Contrasena incorrecta</div>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <div class="tb-left">
      <div class="tb-logo"><span>Nodus</span>Pro</div>
      <div class="tb-tag">Admin</div>
    </div>
    <div class="tb-right">
      <button class="tbtn green" id="btnAdd">+ Agregar</button>
      <button class="tbtn" id="btnRef">&#8635; Actualizar</button>
      <button class="tbtn" id="btnOut">Salir</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on" id="tab-dash" data-tab="dash">Dashboard</div>
    <div class="tab" id="tab-pend" data-tab="pend">Pendientes <span class="badge" id="bpend"></span></div>
    <div class="tab" id="tab-all" data-tab="all">Todos los perfiles</div>
    <div class="tab" id="tab-appr" data-tab="appr">Aprobados</div>
    <div class="tab" id="tab-rej" data-tab="rej">Rechazados</div>
  </div>

  <div class="main" id="main"></div>
</div>

<!-- DETAIL PANEL -->
<div class="dp" id="dp">
  <div class="dp-head">
    <div>
      <div class="dp-name" id="dpName"></div>
      <div class="dp-email" id="dpEmail"></div>
    </div>
    <div class="dp-x" id="dpClose">&#215;</div>
  </div>
  <div class="dp-body" id="dpBody"></div>
  <div class="dp-act" id="dpAct"></div>
</div>

<!-- EDIT MODAL -->
<div class="mo" id="mo">
  <div class="mb">
    <div class="mh">
      <div class="mttl" id="mttl">Editar</div>
      <div class="mx" id="moClose">&#215;</div>
    </div>
    <div class="mbody">
      <input type="hidden" id="eOrig">
      <div class="fgrid">
        <div class="fg2"><div class="lbl">Nombre</div><input class="fi" id="efn"></div>
        <div class="fg2"><div class="lbl">Apellido</div><input class="fi" id="eln"></div>
        <div class="fg2 full"><div class="lbl">Email</div><input class="fi" id="eem"></div>
        <div class="fg2"><div class="lbl">Especialidad</div><input class="fi" id="esp"></div>
        <div class="fg2"><div class="lbl">Region</div><input class="fi" id="erg"></div>
        <div class="fg2"><div class="lbl">Cargo actual</div><input class="fi" id="ecg"></div>
        <div class="fg2"><div class="lbl">Empresa</div><input class="fi" id="eem2"></div>
        <div class="fg2"><div class="lbl">Anos experiencia</div><input class="fi" id="eyr"></div>
        <div class="fg2"><div class="lbl">Ingles</div>
          <select class="fi" id="eng">
            <option value="">-</option>
            <option>Basico</option><option>Intermedio</option>
            <option>Avanzado</option><option>Fluido</option><option>Nativo</option>
          </select>
        </div>
        <div class="fg2"><div class="lbl">Disponibilidad</div>
          <select class="fi" id="edp">
            <option value="now">Disponible ahora</option>
            <option value="soon">Pronto</option>
            <option value="date">Desde fecha</option>
            <option value="no">No disponible</option>
          </select>
        </div>
        <div class="fg2"><div class="lbl">Estado</div>
          <select class="fi" id="est">
            <option value="pending_verification">pending_verification</option>
            <option value="pending_approval">pending_approval</option>
            <option value="approved">approved</option>
            <option value="rejected">rejected</option>
            <option value="flagged">flagged</option>
          </select>
        </div>
        <div class="fg2"><div class="lbl">Sanciones</div>
          <select class="fi" id="esn">
            <option value="clear">clear</option>
            <option value="review">review</option>
            <option value="flagged">flagged</option>
          </select>
        </div>
        <div class="fg2 full"><div class="lbl">LinkedIn</div><input class="fi" id="eli"></div>
        <div class="fg2 full"><div class="lbl">Bio</div><textarea class="fi" id="ebio"></textarea></div>
        <div class="fg2 full"><div class="lbl">Notas internas</div><textarea class="fi" id="enot"></textarea></div>
      </div>
    </div>
    <div class="mfoot">
      <button class="msave" id="mSave">Guardar</button>
      <button class="mcancel" id="mCancel">Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SU='https://eettdimwdjyqniodefop.supabase.co';
var SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVldHRkaW13ZGp5cW5pb2RlZm9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MzA4NDksImV4cCI6MjA5MDEwNjg0OX0.orXdr4qf_Gn7EDwktEwZ6lYCvnXGtB_4AJx9V2C23Mk';
var PASS='NodusAdmin2026!';

var rows=[];
var curTab='dash';
var curPage=1;
var pageSize=20;
var searchQ='';
var filterSt='all';
var curDetail=null;
var toastTM=null;

// Wire up all buttons via JS (no inline onclick on static HTML)
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('lpass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
document.getElementById('btnAdd').addEventListener('click',openAdd);
document.getElementById('btnRef').addEventListener('click',loadAll);
document.getElementById('btnOut').addEventListener('click',doLogout);
document.getElementById('dpClose').addEventListener('click',closeDP);
document.getElementById('moClose').addEventListener('click',closeMo);
document.getElementById('mCancel').addEventListener('click',closeMo);
document.getElementById('mSave').addEventListener('click',saveEdit);
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){showTab(t.getAttribute('data-tab'));});
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDP();closeMo();}});
document.getElementById('mo').addEventListener('click',function(e){if(e.target===this)closeMo();});

function doLogin(){
  var p=document.getElementById('lpass').value;
  if(p===PASS){
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('app').classList.add('on');
    loadAll();
  } else {
    var err=document.getElementById('loginErr');
    err.style.display='block';
    setTimeout(function(){err.style.display='none';},2500);

async function apiGet(path){
  var r=await fetch(SU+path,{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
async function apiMut(path,method,body){
  var r=await fetch(SU+path,{
    method:method,
    headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:body?JSON.stringify(body):undefined
  });
  if(!r.ok)throw new Error('HTTP '+r.status);
  return true;
}

async function loadAll(){
  var m=document.getElementById('main');
  m.innerHTML='<div style="padding:48px;text-align:center;color:var(--text3)">Cargando datos...</div>';
  try{
    var data=await apiGet('/rest/v1/waitlist?select=*&order=created_at.desc&limit=1000');
    rows=data||[];
    var pend=rows.filter(function(r){return r.profile_status==='pending_approval'||r.profile_status==='pending_verification';}).length;
    var bp=document.getElementById('bpend');
    if(bp)bp.textContent=pend>0?pend:'';

  }catch(e){

    toast('Error cargando: '+e.message,'err');

}

function showTab(tab){
  curTab=tab;curPage=1;searchQ='';filterSt='all';
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  var el=document.getElementById('tab-'+tab);
  if(el)el.classList.add('on');
  renderTab(tab);
}

function renderTab(tab){
  var m=document.getElementById('main');
  try{
    if(tab==='dash'){m.innerHTML=buildDash();return;}
    var data=getFiltered(tab);
    m.innerHTML=buildTable(data,tab);
    // Wire search and filter
    var srch=m.querySelector('.srch');
    if(srch)srch.addEventListener('input',function(){searchQ=this.value;curPage=1;renderTab(curTab);});
    var fsel=m.querySelector('.fsel');
    if(fsel)fsel.addEventListener('change',function(){filterSt=this.value;curPage=1;renderTab(curTab);});
  }catch(err){
    m.innerHTML='<div style="padding:40px;color:#F87171">Error: '+err.message+'</div>';
  }
}

function getFiltered(tab){
  var data=rows.slice();
  if(tab==='pend')data=data.filter(function(r){return r.profile_status==='pending_approval'||r.profile_status==='pending_verification';});
  if(tab==='appr')data=data.filter(function(r){return r.profile_status==='approved';});
  if(tab==='rej')data=data.filter(function(r){return r.profile_status==='rejected';});
  if(searchQ){var q=searchQ.toLowerCase();data=data.filter(function(r){return ((r.first_name||'')+(r.last_name||'')+(r.email||'')+(r.specialty||'')+(r.current_company||'')).toLowerCase().includes(q);});}
  if(filterSt!=='all')data=data.filter(function(r){return r.profile_status===filterSt;});
  return data;
}

function pillHtml(s){
  var m={approved:'approved',pending_approval:'pending',pending_verification:'verif',rejected:'rejected',flagged:'flagged'};
  return '<span class="pill '+(m[s]||'pending')+'">'+s+'</span>';
}

function buildDash(){
  var total=rows.length;
  var appr=rows.filter(function(r){return r.profile_status==='approved';}).length;
  var pend=rows.filter(function(r){return r.profile_status==='pending_approval'||r.profile_status==='pending_verification';}).length;
  var cv=rows.filter(function(r){return r.cv_url||r.cv_text;}).length;
  var today=new Date().toISOString().split('T')[0];
  var tod=rows.filter(function(r){return (r.created_at||'').startsWith(today);}).length;
  var rej=rows.filter(function(r){return r.profile_status==='rejected';}).length;
  var avnow=rows.filter(function(r){return r.availability==='now';}).length;
  var tasa=total>0?Math.round(appr/total*100):0;
  var cvpct=total>0?Math.round(cv/total*100):0;
  var pendpct=total>0?Math.round(pend/total*100):0;

  // Sectors
  var secs={};
  rows.forEach(function(r){var s=r.specialty||'Sin sector';secs[s]=(secs[s]||0)+1;});
  var tsecs=Object.entries(secs).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
  var msec=tsecs.length?tsecs[0][1]:1;

  // Sources
  var srcs={};
  rows.forEach(function(r){var s=(r.source||'directo').replace('campaign_','');srcs[s]=(srcs[s]||0)+1;});
  var tsrcs=Object.entries(srcs).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
  var msrc=tsrcs.length?tsrcs[0][1]:1;

  // Daily last 14 days
  var days=[],counts=[];
  for(var i=13;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var ds=d.toISOString().split('T')[0];
    days.push(ds.slice(5));
    counts.push(rows.filter(function(r){return (r.created_at||'').startsWith(ds);}).length);
  }
  var mday=counts.length?Math.max.apply(null,counts)||1:1;

  // Availability
  var avmap={'now':'Ahora','soon':'Pronto','date':'Fecha','no':'No disp','open':'Abierto'};
  var avs={};
  rows.forEach(function(r){var a=avmap[r.availability]||r.availability||'N/A';avs[a]=(avs[a]||0)+1;});
  var tavs=Object.entries(avs).sort(function(a,b){return b[1]-a[1];});

  function mcard(lbl,val,sub,fillPct,color){
    return '<div class="mc"><div class="mc-lbl">'+lbl+'</div><div class="mc-val">'+val+'</div><div class="mc-sub">'+sub+'</div><div class="mc-bar"><div class="mc-fill" style="width:'+fillPct+'%;background:'+color+'"></div></div></div>';
  }
  function bars(items,max,color){
    return items.map(function(it){
      var pct=Math.round(it[1]/max*100);
      var lbl=it[0].length>12?it[0].slice(0,12)+'..':it[0];
      return '<div class="bi"><span class="bl" title="'+it[0]+'">'+lbl+'</span><div class="bt"><div class="bf" style="width:'+pct+'%;background:'+color+'"></div></div><span class="bv">'+it[1]+'</span></div>';
    }).join('');
  }
  var sparks=counts.map(function(c){
    var h=mday>0?Math.max(3,Math.round(c/mday*40)):3;
    return '<div class="sb" title="'+c+'" style="height:'+h+'px"></div>';
  }).join('');

  var last5=rows.slice(0,5).map(function(r){
    var nm=(r.first_name||'')+(r.last_name?' '+r.last_name:'');
    return '<div class="bi" style="cursor:pointer" data-row="'+encodeURIComponent(JSON.stringify(r))+'"><span class="bl" style="width:160px;color:#E0ECFF">'+nm+'</span>'+pillHtml(r.profile_status)+'</div>';
  }).join('');

  var html='<div class="mg">'+
    mcard('Total registrados',total,'+'+tod+' hoy',100,'var(--blue)')+
    mcard('Aprobados',appr,tasa+'% del total',tasa,'var(--green)')+
    mcard('Pendientes',pend,'Requieren revision',pendpct,'var(--amber)')+
    mcard('CVs subidos',cv,cvpct+'% de usuarios',cvpct,'var(--purple)')+
    '</div><div class="mg">'+
    mcard('Tasa aprobacion',tasa+'%',appr+' de '+total+' aprobados',tasa,'var(--green)')+
    mcard('Rechazados',rej,'&nbsp;',total>0?Math.round(rej/total*100):0,'var(--red)')+
    mcard('Disponibles ahora',avnow,'Listos para contacto',total>0?Math.round(avnow/total*100):0,'var(--cyan)')+
    mcard('Registros hoy',tod,'En las ultimas 24h',100,'var(--gold)')+
    '</div><div class="cr">'+
    '<div class="cc"><div class="cc-ttl">Registros (14 dias)</div><div class="spark">'+sparks+'</div><div class="sl"><span class="slbl">'+days[0]+'</span><span class="slbl">'+days[6]+'</span><span class="slbl">'+days[13]+'</span></div></div>'+
    '<div class="cc"><div class="cc-ttl">Por sector</div>'+bars(tsecs,msec,'var(--blue)')+'</div>'+
    '<div class="cc"><div class="cc-ttl">Disponibilidad</div>'+bars(tavs,tavs.length?tavs[0][1]:1,'var(--cyan)')+'</div>'+
    '</div><div class="cr" style="grid-template-columns:1fr 1fr">'+
    '<div class="cc"><div class="cc-ttl">Por fuente de trafico</div>'+bars(tsrcs,msrc,'var(--gold)')+'</div>'+
    '<div class="cc" id="last5cc"><div class="cc-ttl">Ultimos 5 registros</div>'+last5+'</div>'+
    '</div>';

  // Wire last5 click after render
  setTimeout(function(){
    var last5el=document.getElementById('last5cc');
    if(!last5el)return;
    last5el.querySelectorAll('[data-row]').forEach(function(el){
      el.addEventListener('click',function(){
        try{var r=JSON.parse(decodeURIComponent(this.getAttribute('data-row')));showDP(r);}catch(e){}
      });
    });
  },50);

  return html;
}

function buildTable(data,tab){
  var total=data.length;
  var start=(curPage-1)*pageSize;
  var pg=data.slice(start,start+pageSize);
  var pages=Math.ceil(total/pageSize)||1;

  var statusOpts=['all','pending_approval','pending_verification','approved','rejected','flagged'].map(function(s){
    return '<option value="'+s+'"'+(filterSt===s?' selected':'')+'>'+s+'</option>';
  }).join('');

  var trs=pg.length===0
    ?'<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--text3)">Sin resultados</td></tr>'
    :pg.map(function(r,i){
      var nm=(r.first_name||'')+(r.last_name?' '+r.last_name:'');
      var hasCV=r.cv_url||r.cv_text;
      var idx=start+i;
      return '<tr>'+
        '<td class="nc" title="'+nm+'">'+nm+'</td>'+
        '<td class="ec">'+r.email+'</td>'+
        '<td>'+pillHtml(r.profile_status)+'</td>'+
        '<td style="color:var(--text2)">'+((r.specialty||'').slice(0,30)||'-')+'</td>'+
        '<td style="color:var(--text2)">'+(r.location_city||r.region||'-')+'</td>'+
        '<td>'+(hasCV?'<span class="cv-b">CV</span>':'-')+'</td>'+
        '<td style="color:var(--text3)">'+(r.created_at?r.created_at.slice(0,10):'-')+'</td>'+
        '<td class="ac">'+
        '<button class="a v" data-i="'+idx+'">Ver</button>'+
        (r.profile_status!=='approved'?'<button class="a ap" data-ap="'+r.email+'">&#10003;</button>':'')+
        (r.profile_status!=='rejected'?'<button class="a rj" data-rj="'+r.email+'">&#10005;</button>':'')+
        '<button class="a ed" data-i="'+idx+'">Editar</button>'+
        '<button class="a dl" data-dl="'+r.email+'">Borrar</button>'+
        '</td></tr>';
    }).join('');

  var pbs='';
  if(pages>1){
    if(curPage>1)pbs+='<button class="pb" data-p="'+(curPage-1)+'">&#8249;</button>';
    var lo=Math.max(1,curPage-2),hi=Math.min(pages,curPage+2);
    for(var p=lo;p<=hi;p++)pbs+='<button class="pb'+(p===curPage?' on':'')+'" data-p="'+p+'">'+p+'</button>';
    if(curPage<pages)pbs+='<button class="pb" data-p="'+(curPage+1)+'">&#8250;</button>';
  }

  var html='<div class="th"><div class="th-ttl">'+total+' registros</div>'+
    '<div class="th-ctrl">'+
    '<input class="srch" placeholder="Buscar..." value="'+searchQ+'">'+
    (tab==='all'?'<select class="fsel">'+statusOpts+'</select>':'')+
    '</div></div>'+
    '<div class="twrap"><table><thead><tr>'+
    '<th>Nombre</th><th>Email</th><th>Estado</th><th>Especialidad</th><th>Ubicacion</th><th>CV</th><th>Registro</th><th>Acciones</th>'+
    '</tr></thead><tbody>'+trs+'</tbody></table></div>'+
    '<div class="pg"><span>Pagina '+curPage+' de '+pages+'</span><div class="pgb">'+pbs+'</div></div>';

  // Wire buttons after render
  setTimeout(function(){
    var m=document.getElementById('main');
    if(!m)return;
    // View / Edit buttons
    m.querySelectorAll('[data-i]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var r=getFiltered(curTab)[(curPage-1)*pageSize+parseInt(this.getAttribute('data-i'))-(curPage-1)*pageSize];
        // Safer: find by index in full filtered list
        var allF=getFiltered(curTab);
        var start2=(curPage-1)*pageSize;
        var idx2=parseInt(this.getAttribute('data-i'));
        var rec=allF[idx2];
        if(!rec)return;
        if(this.classList.contains('ed'))openEdit(rec);
        else showDP(rec);
      });
    });
    m.querySelectorAll('[data-ap]').forEach(function(btn){
      btn.addEventListener('click',function(){quickAp(this.getAttribute('data-ap'),this);});
    });
    m.querySelectorAll('[data-rj]').forEach(function(btn){
      btn.addEventListener('click',function(){quickRj(this.getAttribute('data-rj'),this);});
    });
    m.querySelectorAll('[data-dl]').forEach(function(btn){
      btn.addEventListener('click',function(){confirmDel(this.getAttribute('data-dl'));});
    });
    m.querySelectorAll('[data-p]').forEach(function(btn){
      btn.addEventListener('click',function(){curPage=parseInt(this.getAttribute('data-p'));renderTab(curTab);});
    });
  },50);

  return html;
}

function fld(label,val,mono){

  return '<div class="fld"><div class="fl">'+label+'</div><div class="fv'+(mono?' m':'')+(empty?' e':'')+'">'+( empty?'No informado':val)+'</div></div>';
}

  var isAp=r.profile_status==='approved';
  var isRj=r.profile_status==='rejected';
  var actEl=document.getElementById('dpAct');
  actEl.innerHTML=

async function quickAp(email,btn){
  if(btn){btn.disabled=true;btn.textContent='...';}
  try{
    await apiMut('/rest/v1/waitlist?email=eq.'+encodeURIComponent(email),'PATCH',{profile_status:'approved'});

async function quickRj(email,btn){

async function saveEdit(){
  var orig=document.getElementById('eOrig').value;
  var isNew=orig==='__new__';
  var email=isNew?document.getElementById('eem').value.trim():orig;
  if(!email){toast('Email requerido','err');return;}
  var payload={
    first_name:document.getElementById('efn').value.trim()||null,
    last_name:document.getElementById('eln').value.trim()||null,
    specialty:document.getElementById('esp').value.trim()||null,
    region:document.getElementById('erg').value.trim()||null,
    current_position:document.getElementById('ecg').value.trim()||null,
    current_company:document.getElementById('eem2').value.trim()||null,
    years_experience:document.getElementById('eyr').value.trim()||null,
    english_level:document.getElementById('eng').value||null,
    availability:document.getElementById('edp').value,
    profile_status:document.getElementById('est').value,
    sanctions_status:document.getElementById('esn').value,
    linkedin_url:document.getElementById('eli').value.trim()||null,
    bio:document.getElementById('ebio').value.trim()||null,
    sanctions_notes:document.getElementById('enot').value.trim()||null
  };
  try{
    if(isNew){
      payload.email=email;payload.lang='es';payload.source='manual_admin';
      await apiMut('/rest/v1/waitlist','POST',payload);
      toast('Perfil creado','ok');
    }else{
      await apiMut('/rest/v1/waitlist?email=eq.'+encodeURIComponent(email),'PATCH',payload);
      toast('Guardado','ok');
    }
    closeMo();loadAll();
  }catch(e){toast('Error: '+e.message,'err');}
}

function toast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast on '+(type||'inf');
  clearTimeout(toastTM);
  toastTM=setTimeout(function(){t.classList.remove('on');},3500);
}
</script>
